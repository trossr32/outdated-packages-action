---
name: Github Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - v*
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get Changelog Entry
        id: get-changelog-entry
        uses: chizovation/changesets-changelog-info@v0.1.5

      - name: Show Change Info
        shell: bash
        # yamllint disable rule:line-length
        run: |
          cat <<'EOInfo' >> $GITHUB_STEP_SUMMARY
          ## Last Change Entry

          ```markdown
          ${{ steps.get-changelog-entry.outputs.last-change-entry }}
          ```
          EOInfo

      - name: Release
        uses: softprops/action-gh-release@v3
        # only run if we have a changelog entry
        if: steps.get-changelog-entry.outputs.last-change-entry != ''
        with:
          body: ${{ steps.get-changelog-entry.outputs.last-change-entry }}
          tag_name: ${{ steps.get-changelog-entry.outputs.last-change-version-v }}
          name: ${{ steps.get-changelog-entry.outputs.last-change-version-v }}
          draft: false
          prerelease: false

      # Move the floating major tag (e.g. v4) to this release so consumers can pin @v4.
      # Pushing with the default GITHUB_TOKEN does not retrigger this workflow.
      - name: Update major version tag
        if: steps.get-changelog-entry.outputs.last-change-entry != ''
        shell: bash
        # yamllint disable rule:line-length
        run: |
          set -euo pipefail

          version="${{ steps.get-changelog-entry.outputs.last-change-version-v }}"   # e.g. v4.0.0

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Changelog version '$version' is not a vMAJOR.MINOR.PATCH release; skipping major tag update."
            exit 0
          fi

          major="${version%%.*}"   # v4.0.0 -> v4

          # Guard against being triggered by the major tag itself (prevents any loop).
          if [[ "${GITHUB_REF_NAME}" == "$major" ]]; then
            echo "Triggered by the '$major' tag itself; nothing to do."
            exit 0
          fi

          echo "Pointing '$major' at ${GITHUB_SHA}"
          git tag -f "$major" "${GITHUB_SHA}"
          git push origin -f "refs/tags/$major"